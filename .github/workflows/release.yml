name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.variant }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # slim = default build (no AI surface); ai = --features ai (mcp + skills).
        # Both flavors are built for every target: 2 x 5 = 10 artifacts. The
        # binary inside is always `sb`; the flavor lives only in the asset name.
        variant: [slim, ai]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sb
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sb
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sb
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sb
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sb.exe
            archive: zip

    env:
      # `sb` for slim, `sb-ai` for the ai flavor — used in the asset filename.
      PREFIX: ${{ matrix.variant == 'ai' && 'sb-ai' || 'sb' }}
      FEATURES: ${{ matrix.variant == 'ai' && '--features ai' || '' }}
      # Pin C dependencies (bundled SQLite, aws-lc) to baseline x86-64, the same
      # baseline rustc targets. The Ubuntu 26.04 runner's GCC emits AVX2/BMI2
      # code by default, which crashed every release from v1.10.0 to v1.12.0 with
      # SIGILL on pre-Haswell CPUs. Only x86_64 Linux builds read this env var.
      CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
      CXXFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}-${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} ${{ env.FEATURES }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} ${{ env.FEATURES }}

      # Run the built binary on an old CPU model (Nehalem: SSE4.2, no AVX/AVX2/
      # BMI2) so a non-baseline instruction fails the release instead of a user.
      # `sync status` on an empty .sb/ opens SQLite with no server needed.
      - name: Smoke test on a baseline CPU
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y qemu-user
          bin="$PWD/target/${{ matrix.target }}/release/sb"
          d=$(mktemp -d) && mkdir "$d/.sb" && cd "$d"
          env HOME="$d" XDG_CONFIG_HOME="$d/.config" XDG_DATA_HOME="$d/.local/share" \
            SB_SERVER_URL=http://127.0.0.1:9 SB_TOKEN=x \
            qemu-x86_64 -cpu Nehalem "$bin" --no-input sync status

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.PREFIX }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../${{ env.PREFIX }}-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREFIX }}-${{ matrix.target }}
          path: ${{ env.PREFIX }}-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        # Bare filenames (not `artifacts/sb-...`) so a downloader can run
        # `sha256sum -c sha256sums.txt` next to the archive it just fetched.
        run: cd artifacts && sha256sum sb-* > sha256sums.txt

      - name: Extract changelog for this version
        id: changelog
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          body=$(awk "/^## v${version}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          printf 'body<<EOF\n%s\nEOF\n' "$body" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/sb-*
            artifacts/sha256sums.txt
